<include src="@components/custom/faq/faq.html" locals='{
	"id":"service-faq",
	"sectionMod":"",
	"modifier":"faq--page",
	"eyebrow":"Good to know",
	"title":"Service & pricing FAQ.",
	"text":"The most common questions about what’s included and how pricing works.",
	"items":[
		{"open":true,"q":"What’s included in the price?","a":"All makeup application is included. Lashes, travel, and trial sessions are priced separately unless stated otherwise."},
		{"open":false,"q":"How is the total price calculated?","a":"The starting price covers the makeup service itself. Travel fees, early start charges, and any additions (such as bridesmaids or a trial) are added based on your specific booking details."},
		{"open":false,"q":"Are lashes included?","a":"False lashes are available on request and may be priced separately. Please mention your preference when enquiring."},
		{"open":false,"q":"What about sensitive skin?","a":"Please mention any allergies, sensitivities, or skin concerns when you enquire. A trial is particularly recommended if you have reactive skin — it allows time to test products and discuss alternatives."},
		{"open":false,"q":"How do I book?","a":"Send an enquiry with your event date, location, number of people, and preferred style. Yana will confirm availability, provide pricing, and send deposit details to secure the date."}
	]
}'></include>
