<include src="@components/custom/faq/faq.html" locals='{
	"id":"faq",
	"sectionMod":"section--tight",
	"modifier":"faq--page",
	"eyebrow":"All the details",
	"title":"Booking, pricing & preparation.",
	"text":"If your question isn’t answered here, get in touch — Yana is always happy to help.",
	"items":[
		{"open":true,"q":"How much does bridal makeup cost in London?","a":"In the premium bridal segment, makeup for the bride typically starts from £180. Bridesmaids and guests are priced separately. All prices are confirmed at the time of enquiry."},
		{"open":false,"q":"Do I need a bridal trial?","a":"A trial is strongly recommended for weddings and major events. It allows you to test and perfect the look in advance, check how products work on your skin, confirm longevity, and plan the timing for the day itself."},
		{"open":false,"q":"Do you travel to me?","a":"Yes. Mobile service is available across London and the surrounding areas. A travel fee applies and is calculated based on your location — this is always confirmed before you book."},
		{"open":false,"q":"How long does makeup take?","a":"Bridal makeup typically takes around 1.5 hours. Bridesmaids and guests approximately 45 minutes each."},
		{"open":false,"q":"What products do you use?","a":"Yana works exclusively with professional and premium brands. The current kit includes: Natasha Denona, Dior, Lancôme, NARS, Kosas, Charlotte Tilbury, Make Up For Ever, Huda Beauty, Rare Beauty, and Hourglass."},
		{"open":false,"q":"How long does makeup last?","a":"With professional skin prep, long-wear techniques, and setting products, makeup typically lasts 8–14 hours. Longevity depends on skin type, weather, and event conditions."},
		{"open":false,"q":"How do I book?","a":"Send an enquiry via the booking form or WhatsApp with your event date, location, and number of people. Yana confirms availability and provides a quote, a deposit secures the date, and final details are confirmed in writing."},
		{"open":false,"q":"Can you work with sensitive skin or different skin tones?","a":"Yes. Please mention any allergies, sensitivities, or concerns when you get in touch. Yana adapts to all skin types, tones, and ages. A trial is particularly recommended if you have reactive skin, as it provides time to test products and discuss alternatives."},
		{"open":false,"q":"What if I need to cancel or reschedule?","a":"Cancellation and rescheduling terms are provided at the time of booking. A deposit is required to secure your date."},
		{"open":false,"q":"Are lashes included?","a":"False lashes are available on request and may be priced separately. Please mention your preference when enquiring."},
		{"open":false,"q":"How are brushes and tools cleaned?","a":"Professional hygiene standards are maintained throughout. All brushes and tools are cleaned between clients. If you have specific concerns, please raise them when you get in touch."}
	]
}'></include>
