<include src="@components/custom/faq/faq.html" locals='{
	"id":"bridal-faq",
	"sectionMod":"section--tight",
	"modifier":"faq--page",
	"eyebrow":"Bridal questions",
	"title":"Bridal FAQ.",
	"text":"Coverage, booking, deposits, trials, timing, and group bookings — answered.",
	"items":[
		{"open":true,"q":"What areas do you cover for bridal makeup?","a":"Yana is based in London and travels to weddings across the city and surrounding areas. Travel fees apply outside central London and are calculated based on your location."},
		{"open":false,"q":"How do I book bridal makeup?","a":"Send an enquiry with your wedding date, venue area, and number of people. Yana will confirm availability, provide pricing, and send deposit details to secure your date."},
		{"open":false,"q":"Is a deposit required?","a":"Yes. A deposit is required to secure your wedding date. Details are confirmed at the time of booking."},
		{"open":false,"q":"Do you charge for travel?","a":"Yes. A travel fee applies and is calculated based on your location. This is confirmed before you book — no surprises."},
		{"open":false,"q":"Is a bridal trial included?","a":"The trial is a separate appointment and is priced accordingly. It is strongly recommended for all brides."},
		{"open":false,"q":"What if I have sensitive skin or allergies?","a":"Please mention any skin concerns or allergies when you enquire. The trial is a good opportunity to test products and discuss alternatives if needed."},
		{"open":false,"q":"How long does bridal makeup take?","a":"As a guide, bridal makeup takes approximately 1.5 hours. Bridesmaids and guests approximately 45 minutes each."},
		{"open":false,"q":"Can you accommodate a bridal party?","a":"Yes. Please include the number of people when you enquire so Yana can plan timing and confirm pricing."}
	]
}'></include>
