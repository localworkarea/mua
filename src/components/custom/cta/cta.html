<section data-att-cta class="section section--tight">
	<div class="container">
		<div class="cta reveal" data-att-watcher data-att-watcher-once>
			<span class="cta__deco" aria-hidden="true"></span>
			<span class="cta__dot"><i aria-hidden="true"></i>[[dot]]</span>
			<div class="cta__grid">
				<div>
					<p class="eyebrow eyebrow--white">[[eyebrow]]</p>
					<h2>[[title]]</h2>
					<p>[[text]]</p>
				</div>
				<div class="cta__actions">
					<a class="btn btn--white btn--lg" href="contact.html" aria-label="Check availability — go to the contact page">Check availability</a>
					<a class="btn btn--ghost btn--lg" href="contact.html" aria-label="Message Yana on WhatsApp">Message on WhatsApp</a>
				</div>
			</div>
		</div>
	</div>
</section>
