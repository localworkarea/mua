<section data-att-faq class="section [[sectionMod]]" id="[[id]]">
	<div class="container faq [[modifier]]">
		<div class="faq__head reveal" data-att-watcher data-att-watcher-once>
			<p class="eyebrow">[[eyebrow]]</p>
			<h2>[[title]]</h2>
			<p>[[text]]</p>
		</div>
		<div class="faq__list" data-att-spollers data-att-spollers-one>
			<each loop="item in items">
				<if condition="item.open">
					<details class="faq__item reveal" data-att-watcher data-att-watcher-once data-att-spollers-open open>
						<summary class="faq__q">[[item.q]]<span class="faq__sign" aria-hidden="true"></span></summary>
						<div class="faq__a"><p>[[item.a]]</p></div>
					</details>
				</if>
				<else>
					<details class="faq__item reveal" data-att-watcher data-att-watcher-once>
						<summary class="faq__q">[[item.q]]<span class="faq__sign" aria-hidden="true"></span></summary>
						<div class="faq__a"><p>[[item.a]]</p></div>
					</details>
				</else>
			</each>
		</div>
	</div>
</section>
