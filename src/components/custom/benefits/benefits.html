<section data-att-benefits class="section [[modifier]]">
	<div class="container">
		<div class="sec-head reveal" data-att-watcher data-att-watcher-once>
			<div>
				<p class="eyebrow">[[eyebrow]]</p>
				<h2>[[title]]</h2>
			</div>
			<p>[[text]]</p>
		</div>
		<div class="benefits">
			<each loop="item in items">
				<div class="benefit [[item.modifier]] reveal" data-att-watcher data-att-watcher-once>
					<span class="benefit__num">[[item.num]]</span>
					<div>
						<h3>[[item.title]]</h3>
						<p>[[item.text]]</p>
					</div>
				</div>
			</each>
		</div>
	</div>
</section>
