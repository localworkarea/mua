<section data-att-pricing class="section [[modifier]]">
	<div class="container">
		<div class="sec-head reveal" data-att-watcher data-att-watcher-once>
			<div>
				<p class="eyebrow">[[eyebrow]]</p>
				<h2>[[title]]</h2>
			</div>
			<p>[[text]]</p>
		</div>
		<div class="pricing reveal" data-att-watcher data-att-watcher-once>
			<each loop="row in rows">
				<div class="price-row">
					<div class="price-row__name">[[row.name]] <small>[[row.desc]]</small></div>
					<div class="price-row__price">[[row.price]] <small>[[row.priceNote]]</small></div>
				</div>
			</each>
		</div>
		<p class="note">[[note]]</p>
	</div>
</section>
