<section data-att-brands class="section section--tight">
	<div class="container brands">
		<div class="brands__panel reveal" data-att-watcher data-att-watcher-once>
			<div>
				<p class="eyebrow">[[eyebrow]]</p>
				<h2>[[title]]</h2>
			</div>
			<div class="brands__marq">
				<div class="brands__track">
					<each loop='brand in ["Natasha Denona","Dior","Lancôme","NARS","Kosas","Charlotte Tilbury","Make Up For Ever","Huda Beauty","Rare Beauty","Hourglass"]'><span>[[brand]]</span><i></i></each>
					<each loop='brand in ["Natasha Denona","Dior","Lancôme","NARS","Kosas","Charlotte Tilbury","Make Up For Ever","Huda Beauty","Rare Beauty","Hourglass"]'><span>[[brand]]</span><i></i></each>
				</div>
			</div>
		</div>
		<div class="brands__img reveal" data-att-watcher data-att-watcher-once>
			<img class="ph ph--cool" src="@img/kit-flatlay.jpg" alt="Luxury makeup kit flatlay" loading="lazy" />
		</div>
	</div>
</section>
