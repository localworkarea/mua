<section data-att-contact-cards class="section" id="[[id]]">
	<div class="container">
		<div class="sec-head reveal" data-att-watcher data-att-watcher-once>
			<div>
				<p class="eyebrow">[[eyebrow]]</p>
				<h2>[[title]]</h2>
			</div>
			<p>[[text]]</p>
		</div>
		<div class="contact">
			<each loop="item in items">
				<article class="contact__card reveal" data-att-watcher data-att-watcher-once>
					<p class="eyebrow">[[item.eyebrow]]</p>
					<h3>[[item.title]]</h3>
					<p>[[item.text]]</p>
					<a class="btn [[item.btnClass]]" href="[[item.href]]" aria-label="[[item.label]]">[[item.label]]</a>
				</article>
			</each>
		</div>
	</div>
</section>
